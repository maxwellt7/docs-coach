name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.4.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - name: Install web dependencies
        run: cd apps/web && pnpm install --frozen-lockfile=false
      - name: Typecheck web
        run: cd apps/web && pnpm check
      - name: Build web
        run: cd apps/web && pnpm build

  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install API dependencies
        run: cd apps/api && pip install -r requirements.txt
      - name: Import FastAPI app
        run: cd apps/api && python -c "from app.main import app; print(app.title)"
